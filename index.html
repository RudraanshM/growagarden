<!DOCTYPE html>
<html>
<head>
<title>Grow a Garden</title>
<style>
body {
  font-family: Arial;
  background:#b7e7a7;
  padding:20px;
}
#money { font-size:20px; margin-bottom:10px; }
#shop,#garden { display:flex; flex-wrap:wrap; gap:10px; }
.item,.plant {
  background:white;
  border:2px solid #333;
  border-radius:8px;
  padding:10px;
  width:190px;
  text-align:center;
}
.cooldown { font-size:12px; }

#saveBtn,#resetBtn{
  margin-bottom:15px;
  padding:8px 14px;
  background:#2196f3;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#resetBtn{
  background:#e53935;
  margin-left:8px;
}

.silver { color:silver; }
.gold { color:gold; }

.rainbow {
  background:linear-gradient(90deg,red,orange,yellow,green,blue,purple);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 3s linear infinite;
}
@keyframes rainbow {
  0%{background-position:0%}
  100%{background-position:100%}
}

.disco {
  animation:disco 0.5s infinite;
}
@keyframes disco {
  0%{color:red}
  20%{color:yellow}
  40%{color:green}
  60%{color:blue}
  80%{color:pink}
  100%{color:red}
}

.admin{
  display:inline-block;
  animation:adminRock 0.15s infinite;
}
@keyframes adminRock{
  0%{transform:rotate(-15deg)}
  50%{transform:rotate(15deg)}
  100%{transform:rotate(-15deg)}
}

.rickroll{
  background:linear-gradient(90deg,pink,cyan,pink);
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 1s infinite;
}
</style>
</head>

<body>
<h1>🌱 Grow a Garden</h1>
<div id="money"></div>

<button id="saveBtn" onclick="saveGame()">💾 Save Game</button>
<button id="resetBtn" onclick="resetGame()">🗑 Reset Data</button>

<h2>Shop</h2>
<div id="shop"></div>

<h2>Your Garden</h2>
<div id="garden"></div>

<script>

let money=10;

let forceMutation=null;
let devMode=false;

let usedCodes={};

const moneyDiv=document.getElementById("money");
const garden=document.getElementById("garden");

function formatNumber(n){

const units=[
"",
"K","M","B","T",
"Qa","Qi","Sx","Sp","Oc","No",
"Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Od","Nd",
"Vg","Uvg","Dvg","Tvg","Qavg","Qivg","Sxvg","Spvg","Ocvg","Novg"
];

if(n<1000) return Math.floor(n);

let tier=Math.floor(Math.log10(n)/3);

if(tier>=units.length){
return n.toExponential(2);
}

let scale=Math.pow(10,tier*3);
let scaled=n/scale;

return scaled.toFixed(2)+" "+units[tier];
}

const plants=[
{name:"Carrot",type:"single",buy:10,gain:18},
{name:"Strawberry",type:"multi",buy:50,gain:14},
{name:"Blueberry",type:"multi",buy:400,gain:18},
{name:"Buttercup",type:"single",buy:600,gain:542},
{name:"Tomato",type:"multi",buy:800,gain:27},
{name:"Corn",type:"multi",buy:1300,gain:36},
{name:"Daffodil",type:"single",buy:1000,gain:1000},
{name:"Watermelon",type:"single",buy:2500,gain:2500},
{name:"Pumpkin",type:"single",buy:3000,gain:3000},
{name:"Apple",type:"multi",buy:3250,gain:248},
{name:"Bamboo",type:"single",buy:4000,gain:3999},
{name:"Coconut",type:"multi",buy:6000,gain:361},
{name:"Cactus",type:"multi",buy:15000,gain:3068},
{name:"Dragonfruit",type:"multi",buy:50000,gain:4287},
{name:"Mango",type:"multi",buy:100000,gain:5886},
{name:"Candy Blossom",type:"multi",buy:0,gain:90250},
{name:"Mushroom",type:"single",buy:150000,gain:136278},
{name:"Grape",type:"multi",buy:850000,gain:7085},
{name:"Pepper",type:"multi",buy:1000000,gain:7220},
{name:"Cacao",type:"multi",buy:2500000,gain:10830},
{name:"Sunflower",type:"multi",buy:5555555,gain:50138},
{name:"Beanstalk",type:"multi",buy:10000000,gain:25270},
{name:"Sugar Apple",type:"multi",buy:25000000,gain:43320},
{name:"Burning Bud",type:"multi",buy:40000000,gain:63175},
{name:"Ember Lilly",type:"multi",buy:50000000,gain:60166},
{name:"Giant Pinecone",type:"multi",buy:55000000,gain:64980},
{name:"Elder Strawberry",type:"multi",buy:70000000,gain:81225},
{name:"Romanesco",type:"multi",buy:88000000,gain:149815},
{name:"Crimson Thorn",type:"multi",buy:10000000000,gain:189525},
{name:"Zebrazincle",type:"multi",buy:21000000000,gain:234650},
{name:"Octobloom",type:"multi",buy:33000000000,gain:260721},
{name:"Beast Buttercup",type:"single",buy:500000000000,gain:2707500},
{name:"Alien Apple",type:"multi",buy:1000000000000,gain:902500},
{name:"Rubiks Cube Blossom",type:"multi",buy:0,gain:1e15},
{name:"Rickroll Berry",type:"multi",buy:0,gain:1e100}
];

function updateMoney(){
moneyDiv.textContent="Money: "+formatNumber(money);
}

function getMutation(){

if(forceMutation){
let map={
silver:{m:5,c:"silver"},
gold:{m:20,c:"gold"},
rainbow:{m:50,c:"rainbow"},
disco:{m:125,c:"disco"},
admin:{m:1000000,c:"admin"},
rickroll:{m:1e100,c:"rickroll"}
};
return map[forceMutation];
}

let r=Math.random();
if(r<0.000001) return {m:125,c:"disco"};
if(r<0.001) return {m:50,c:"rainbow"};
if(r<0.01) return {m:20,c:"gold"};
if(r<0.05) return {m:5,c:"silver"};
return {m:1,c:""};
}

function addToGarden(p,forceMut){

const box=document.createElement("div");
box.className="plant";

const title=document.createElement("b");
title.textContent=p.name;

const mut=forceMut?forceMut:getMutation();

if(mut.c) title.classList.add(mut.c);

box.appendChild(title);

const cd=document.createElement("div");
cd.className="cooldown";
box.appendChild(cd);

garden.appendChild(box);

autoSave();

if(p.type==="single"){

const btn=document.createElement("button");
btn.textContent="Harvest";

btn.onclick=()=>{
money+=p.gain*mut.m;
updateMoney();
box.remove();
autoSave();
};

box.appendChild(btn);

}else{

let t=5;
cd.textContent="Harvest in "+t+"s";

setInterval(()=>{
t--;
cd.textContent="Harvest in "+t+"s";

if(t<=0){
money+=p.gain*mut.m;
updateMoney();
autoSave();
t=5;
}
},1000);

}

}

function buyPlant(p){
if(money<p.buy) return alert("Not enough money");

money-=p.buy;
updateMoney();

addToGarden(p);
}

function createShop(){

const shop=document.getElementById("shop");

plants.filter(p=>p.buy>0).forEach(p=>{

const d=document.createElement("div");
d.className="item";

d.innerHTML=`<b>${p.name}</b><br>Buy:${formatNumber(p.buy)}<br>Gives:${formatNumber(p.gain)}<br><button>Buy</button>`;

d.querySelector("button").onclick=()=>buyPlant(p);

shop.appendChild(d);

});

}

function getPlantData(){

const plantData=[];

document.querySelectorAll(".plant").forEach(box=>{

const title=box.querySelector("b");

let cls="";

if(title.classList.contains("silver")) cls="silver";
if(title.classList.contains("gold")) cls="gold";
if(title.classList.contains("rainbow")) cls="rainbow";
if(title.classList.contains("disco")) cls="disco";
if(title.classList.contains("admin")) cls="admin";
if(title.classList.contains("rickroll")) cls="rickroll";

plantData.push({
name:title.textContent,
mutation:cls
});

});

return plantData;
}

function saveGame(){
localStorage.setItem("gardenMoney",money);
localStorage.setItem("gardenPlants",JSON.stringify(getPlantData()));
alert("Saved!");
}

function loadGame(){

const savedMoney=localStorage.getItem("gardenMoney");
const savedPlants=localStorage.getItem("gardenPlants");

if(savedMoney){
money=Number(savedMoney);
}

if(savedPlants){

JSON.parse(savedPlants).forEach(item=>{

const p=plants.find(x=>x.name===item.name);

if(!p) return;

let mut={m:1,c:""};

if(item.mutation==="silver") mut={m:5,c:"silver"};
if(item.mutation==="gold") mut={m:20,c:"gold"};
if(item.mutation==="rainbow") mut={m:50,c:"rainbow"};
if(item.mutation==="disco") mut={m:125,c:"disco"};
if(item.mutation==="admin") mut={m:1000000,c:"admin"};
if(item.mutation==="rickroll") mut={m:1e100,c:"rickroll"};

addToGarden(p,mut);

});

}

}

function autoSave(){
localStorage.setItem("gardenMoney",money);
localStorage.setItem("gardenPlants",JSON.stringify(getPlantData()));
}

function resetGame(){

if(!confirm("Delete all saved data?")) return;

localStorage.removeItem("gardenMoney");
localStorage.removeItem("gardenPlants");

money=10;
garden.innerHTML="";

updateMoney();

alert("Reset!");
}

loadGame();
createShop();
updateMoney();

</script>
</body>
</html>
