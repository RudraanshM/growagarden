<!DOCTYPE html>
<html>
<head>
<title>Grow a Garden</title>
<style>
body {
  font-family: Arial;
  background:#b7e7a7;
  padding:20px;
}
#money { font-size:20px; margin-bottom:10px; }
#shop,#garden { display:flex; flex-wrap:wrap; gap:10px; }
.item,.plant {
  background:white;
  border:2px solid #333;
  border-radius:8px;
  padding:10px;
  width:190px;
  text-align:center;
}
.cooldown { font-size:12px; }

.silver { color:silver; }
.gold { color:gold; }

.rainbow{
  background:linear-gradient(90deg,red,orange,yellow,green,blue,purple);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 3s linear infinite;
}
@keyframes rainbow{
  0%{background-position:0%}
  100%{background-position:100%}
}

.disco{ animation:disco .5s infinite; }
@keyframes disco{
  0%{color:red}
  20%{color:yellow}
  40%{color:green}
  60%{color:blue}
  80%{color:pink}
  100%{color:red}
}

.admin{
  display:inline-block;
  animation:adminRock .15s infinite;
}
@keyframes adminRock{
  0%{transform:rotate(-15deg)}
  50%{transform:rotate(15deg)}
  100%{transform:rotate(-15deg)}
}

.rickroll{
  background:linear-gradient(90deg,pink,cyan,pink);
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 1s infinite;
}

#gardenWrap{
  position:relative;
}

#settingsBtn{
  position:absolute;
  right:0;
  top:-40px;
  display:inline-block;
  font-size:22px;
  cursor:pointer;
  background:white;
  border:2px solid #333;
  border-radius:8px;
  padding:4px 8px;
}

#settingsMenu{
  display:none;
  position:absolute;
  right:0;
  top:0;
  background:white;
  border:2px solid #333;
  border-radius:8px;
  padding:10px;
  width:max-content;
}
</style>
</head>

<body>

<h1>🌱 Grow a Garden</h1>

<div id="money"></div>

<h2>Shop</h2>
<div id="shop"></div>

<h2>Your Garden</h2>

<div id="gardenWrap">
<div id="settingsBtn">⚙</div>

<div id="settingsMenu">
<button onclick="resetGame()">Reset Everything</button>
</div>

<div id="garden"></div>
</div>

<h2>Enter Code</h2>
<input id="codeInput">
<button onclick="checkCode()">Submit</button>

<script>

let money=10;
let forceMutation=null;
let devMode=false;

const moneyDiv=document.getElementById("money");
const garden=document.getElementById("garden");

const SAVE_KEY="growGardenSaveV1";

function saveGame(){
const plantsData=[...garden.children].map(box=>({
name:box.dataset.name,
type:box.dataset.type,
gain:+box.dataset.gain,
mutation:{
m:+box.dataset.mutm,
c:box.dataset.mutc
}
}));

localStorage.setItem(SAVE_KEY,JSON.stringify({
money,
plants:plantsData
}));
}

function loadGame(){
const raw=localStorage.getItem(SAVE_KEY);
if(!raw) return;

const data=JSON.parse(raw);

money=data.money ?? 10;

(data.plants||[]).forEach(p=>{
addToGarden(
{name:p.name,type:p.type,gain:p.gain},
p.mutation,
true
);
});
}

function resetGame(){
localStorage.removeItem(SAVE_KEY);
money=10;
garden.innerHTML="";
updateMoney();
}

document.getElementById("settingsBtn").onclick=()=>{
const m=document.getElementById("settingsMenu");
m.style.display=m.style.display==="block"?"none":"block";
};

function formatNumber(n){
const units=["","K","M","B","T"];
if(n<1000) return Math.floor(n);
let tier=Math.floor(Math.log10(n)/3);
if(tier>=units.length) return n.toExponential(2);
let scale=Math.pow(10,tier*3);
return (n/scale).toFixed(2)+" "+units[tier];
}

const plants=[
{name:"Carrot",type:"single",buy:10,gain:18},
{name:"Strawberry",type:"multi",buy:50,gain:14},
{name:"Blueberry",type:"multi",buy:400,gain:18}
];

function updateMoney(){
moneyDiv.textContent="Money: "+formatNumber(money);
saveGame();
}

function getMutation(){
if(forceMutation){
let map={
silver:{m:5,c:"silver"},
gold:{m:20,c:"gold"},
rainbow:{m:50,c:"rainbow"},
disco:{m:125,c:"disco"},
admin:{m:1000000,c:"admin"},
rickroll:{m:1e100,c:"rickroll"}
};
return map[forceMutation];
}

let r=Math.random();
if(r<0.001) return {m:50,c:"rainbow"};
if(r<0.01) return {m:20,c:"gold"};
if(r<0.05) return {m:5,c:"silver"};
return {m:1,c:""};
}

function addToGarden(p,forceMut,isLoading=false){

const box=document.createElement("div");
box.className="plant";

const title=document.createElement("b");
title.textContent=p.name;

const mut=forceMut||getMutation();

if(mut.c) title.classList.add(mut.c);

box.dataset.name=p.name;
box.dataset.type=p.type;
box.dataset.gain=p.gain;
box.dataset.mutm=mut.m;
box.dataset.mutc=mut.c;

box.appendChild(title);

const cd=document.createElement("div");
cd.className="cooldown";
box.appendChild(cd);

garden.appendChild(box);

if(p.type==="single"){
const btn=document.createElement("button");
btn.textContent="Harvest";

btn.onclick=()=>{
money+=p.gain*mut.m;
box.remove();
updateMoney();
};

box.appendChild(btn);

}else{
let t=5;
cd.textContent="Harvest in "+t+"s";

setInterval(()=>{
t--;
cd.textContent="Harvest in "+t+"s";

if(t<=0){
money+=p.gain*mut.m;
updateMoney();
t=5;
}
},1000);
}

if(!isLoading) saveGame();
}

function buyPlant(p){
if(money<p.buy) return alert("Not enough money");

money-=p.buy;
addToGarden(p);
updateMoney();
}

function createShop(){
const shop=document.getElementById("shop");

plants.forEach(p=>{
const d=document.createElement("div");
d.className="item";

d.innerHTML=`<b>${p.name}</b><br>
Buy:${formatNumber(p.buy)}<br>
Gives:${formatNumber(p.gain)}<br>
<button>Buy</button>`;

d.querySelector("button").onclick=()=>buyPlant(p);

shop.appendChild(d);
});
}

function checkCode(){}

createShop();
loadGame();
updateMoney();

</script>
</body>
</html>
