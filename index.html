<!DOCTYPE html>
<html>
<head>
<title>Grow a Garden</title>
<style>
body {
  font-family: Arial;
  background:#b7e7a7;
  padding:20px;
}
#money { font-size:20px; margin-bottom:10px; }
#shop,#garden { display:flex; flex-wrap:wrap; gap:10px; }

.item,.plant {
  background:white;
  border:2px solid #333;
  border-radius:8px;
  padding:10px;
  width:190px;
  text-align:center;
}

.cooldown { font-size:12px; }

#saveBtn,#resetBtn{
  margin-bottom:15px;
  padding:8px 14px;
  background:#2196f3;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#resetBtn{
  background:#e53935;
  margin-left:8px;
}

.silver { color:silver; }
.gold { color:gold; }

.rainbow {
  background:linear-gradient(90deg,red,orange,yellow,green,blue,purple);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 3s linear infinite;
}

@keyframes rainbow {
  0%{background-position:0%}
  100%{background-position:100%}
}

.disco {
  animation:disco 0.5s infinite;
}

@keyframes disco {
  0%{color:red}
  20%{color:yellow}
  40%{color:green}
  60%{color:blue}
  80%{color:pink}
  100%{color:red}
}

.admin{
  display:inline-block;
  animation:adminRock 0.15s infinite;
}

@keyframes adminRock{
  0%{transform:rotate(-15deg)}
  50%{transform:rotate(15deg)}
  100%{transform:rotate(-15deg)}
}

.rickroll{
  background:linear-gradient(90deg,pink,cyan,pink);
  -webkit-background-clip:text;
  color:transparent;
  animation:rainbow 1s infinite;
}

/* 🥕 CARROT EVENT STYLES */
.carrotFollower{
  position:fixed;
  pointer-events:none;
  font-size:20px;
  z-index:9999;
  animation:pulse 0.3s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

.flyingCarrot{
  position:fixed;
  font-size:16px;
  z-index:9998;
  pointer-events:none;
}

/* 🎉 PLANT PARTY STYLES */
#partyBanner{
  display:none;
  position:fixed;
  top:0; left:0; right:0;
  padding:12px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  z-index:10000;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe600,#00ff80,#00c8ff,#8000ff);
  background-size:400%;
  animation:partyBannerAnim 1s linear infinite;
  color:white;
  text-shadow:0 0 8px #000, 0 0 16px #fff;
  letter-spacing:2px;
}

@keyframes partyBannerAnim{
  0%{background-position:0%}
  100%{background-position:100%}
}

@keyframes bodyFlash{
  0%  {background:#ff0080}
  14% {background:#ff8c00}
  28% {background:#ffe600}
  42% {background:#00ff80}
  57% {background:#00c8ff}
  71% {background:#8000ff}
  85% {background:#ff0080}
  100%{background:#ff8c00}
}

body.party-mode{
  animation:bodyFlash 0.5s linear infinite;
}

/* SHOVEL UI */
.shovel-mode {
  outline: 4px solid orange;
  box-shadow: 0 0 8px rgba(255,165,0,0.6);
}
body.shovel-active { cursor: crosshair; }

/* Toast for messages */
#toast {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  z-index: 20000;
  display: none;
  font-weight: bold;
}
</style>
</head>

<body>
<div id="partyBanner">🎉 PLANT PARTY! <span id="partyCountdown">60</span>s 🎉</div>

<h1>🌱 Grow a Garden</h1>
<div id="money"></div>

<button id="saveBtn" onclick="saveGame()">💾 Save Game</button>
<button id="resetBtn" onclick="resetGame()">🗑 Reset Data</button>

<h2>Shop</h2>
<div id="shop"></div>

<h2>Your Garden</h2>
<div id="garden"></div>

display:none;
position:fixed;

left:50%;

border:3px solid #333;

">

<input id="adminCommand"
placeholder="/spawn(carrot)(gold)"
style="width:220px;">

<br><br>

<button onclick="runAdminCommand()">Run</button>

</div>

<br><br>

<button onclick="unlockAdmin()">Unlock</button>

</div>

<div id="toast"></div>

<script>

let money=10;
let devMode=false;
let income = { mult: 1 };

let carrotEventActive = false;
let plantPartyActive = false;

const moneyDiv=document.getElementById("money");
const garden=document.getElementById("garden");
const toast=document.getElementById("toast");

function formatNumber(n){

const units=[
"","K","M","B","T",
"Qa","Qi","Sx","Sp","Oc","No",
"Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Od","Nd",
"Vg","Uvg","Dvg","Tvg","Qavg","Qivg","Sxvg","Spvg","Ocvg","Novg"
];

if(n<1000) return Math.floor(n);

let tier=Math.floor(Math.log10(n)/3);

if(tier>=units.length){
return n.toExponential(2);
}

let scale=Math.pow(10,tier*3);
let scaled=n/scale;

return scaled.toFixed(2)+" "+units[tier];
}

const plants=[

{name:"Blueberry",type:"multi",buy:400,gain:18},

{name:"Mango",type:"multi",buy:100000,gain:5886},
{name:"Candy Blossom",type:"multi",buy:0,gain:90250},
{name:"Mushroom",type:"single",buy:150000,gain:136278},

{name:"Cacao",type:"multi",buy:2500000,gain:10830},
{name:"Sunflower",type:"multi",buy:5555555,gain:50138},
{name:"Beanstalk",type:"multi",buy:10000000,gain:25270},
{name:"Sugar Apple",type:"multi",buy:25000000,gain:43320},
{name:"Burning Bud",type:"multi",buy:40000000,gain:63175},
{name:"Ember Lilly",type:"multi",buy:50000000,gain:60166},
{name:"Giant Pinecone",type:"multi",buy:55000000,gain:64980},
{name:"Elder Strawberry",type:"multi",buy:70000000,gain:81225},
{name:"Romanesco",type:"multi",buy:88000000,gain:149815},
{name:"Crimson Thorn",type:"multi",buy:10000000000,gain:189525},
{name:"Zebrazincle",type:"multi",buy:21000000000,gain:234650},
{name:"Octobloom",type:"multi",buy:33000000000,gain:260721},
{name:"Beast Buttercup",type:"single",buy:500000000000,gain:2707500},
{name:"Alien Apple",type:"multi",buy:1000000000000,gain:902500},
{name:"Rubiks Cube Blossom",type:"multi",buy:0,gain:1e15},
{name:"Rickroll Berry",type:"multi",buy:0,gain:1e100}
];

function updateMoney(){
moneyDiv.textContent="Money: "+formatNumber(money);
}

/* =========================
   🥕 CARROT EVENT SYSTEM
========================= */

document.addEventListener("mousemove",(e)=>{
if(window.carrotFollower){
window.carrotFollower.style.left=e.clientX+"px";
window.carrotFollower.style.top=e.clientY+"px";
}
});

function startCarrotEvent(){

if(carrotEventActive) return;
carrotEventActive=true;

const follower=document.createElement("div");
follower.className="carrotFollower";
follower.textContent="🥕 go carrots";
document.body.appendChild(follower);
window.carrotFollower=follower;

setTimeout(()=>{
follower.remove();
window.carrotFollower=null;

for(let i=0;i<1000;i++){
spawnFlyingCarrot();
}

setTimeout(()=>{
document.querySelectorAll(".flyingCarrot").forEach(c=>c.remove());
spawnMutantCarrot();
carrotEventActive=false;
},30000);

},5000);

}

function spawnFlyingCarrot(){
const c=document.createElement("div");
c.className="flyingCarrot";
c.textContent="🥕";

c.style.left=Math.random()*window.innerWidth+"px";
c.style.top=Math.random()*window.innerHeight+"px";

document.body.appendChild(c);

let dx=(Math.random()-0.5)*10;
let dy=(Math.random()-0.5)*10;

let t=setInterval(()=>{
let x=parseFloat(c.style.left);
let y=parseFloat(c.style.top);
x+=dx;
y+=dy;
c.style.left=x+"px";
c.style.top=y+"px";
},30);

setTimeout(()=>{
clearInterval(t);
c.remove();
},30000);
}

function spawnMutantCarrot(){

const box=document.createElement("div");
box.className="plant";

const title=document.createElement("b");
title.textContent="Mutant Carrot 🧬";
box.appendChild(title);

garden.appendChild(box);

/* store and attach the interval id so shovel can clear it later */
const intervalId = setInterval(()=>{
money += 2.1e34;
updateMoney();
autoSave();
},1000);
box.dataset.interval = intervalId;

}

/* =========================
   🎉 PLANT PARTY SYSTEM
========================= */

function startPlantParty(){

if(plantPartyActive) return;
plantPartyActive=true;

/* 1. Rename all plants permanently */
document.querySelectorAll(".plant").forEach(box=>{
  const title=box.querySelector("b");
  if(!title) return;
  const current=title.textContent;
  const partyName=partyNames[current];
  if(partyName) title.textContent=partyName;
});

/* 2. Flash screen */
document.body.classList.add("party-mode");

/* 3. Show banner */
const banner=document.getElementById("partyBanner");
banner.style.display="block";
let timeLeft=60;
document.getElementById("partyCountdown").textContent=timeLeft;

const countdownTick=setInterval(()=>{
  timeLeft--;
  document.getElementById("partyCountdown").textContent=timeLeft;
  if(timeLeft<=0) clearInterval(countdownTick);
},1000);

/* 4. Disco mutation to random plant every 2s */
const discoInterval=setInterval(()=>{
  const allPlants=document.querySelectorAll(".plant");
  if(allPlants.length===0) return;
  const pick=allPlants[Math.floor(Math.random()*allPlants.length)];
  const title=pick.querySelector("b");
  if(!title) return;
  title.classList.remove("silver","gold","rainbow","admin","rickroll");
  title.classList.add("disco");
  /* Store the new multiplier on the box so harvesting uses it */
  pick.dataset.partyDisco="1";
},2000);

/* 5. End party after 60s */
setTimeout(()=>{
  clearInterval(discoInterval);
  document.body.classList.remove("party-mode");
  banner.style.display="none";
  plantPartyActive=false;
  autoSave();
},60000);

autoSave();
}

/* =========================
   SHOP + GAME LOGIC
========================= */

function getMutation(){
let r=Math.random();
if(r<0.000001) return {m:125,c:"disco"};
if(r<0.001) return {m:50,c:"rainbow"};
if(r<0.01) return {m:20,c:"gold"};
if(r<0.05) return {m:5,c:"silver"};
return {m:1,c:""};
}

function addToGarden(p,forceMut){

const box=document.createElement("div");
box.className="plant";

const title=document.createElement("b");

/* If party is active, use party name */
const displayName=(plantPartyActive && partyNames[p.name]) ? partyNames[p.name] : p.name;
title.textContent=displayName;

const mut=forceMut?forceMut:getMutation();

if(mut.c) title.classList.add(mut.c);

box.appendChild(title);

const cd=document.createElement("div");
cd.className="cooldown";
box.appendChild(cd);

/* click handler: supports shovel destroying plants (ignores clicks on buttons) */
box.addEventListener('click', (ev) => {
  // if user clicked a button inside the plant, don't treat as shovel click
  if (ev.target && ev.target.closest && ev.target.closest('button')) return;
  if (shovelMode) {
    destroyPlant(box);
  }
});

garden.appendChild(box);

autoSave();

if(p.type==="single"){

const btn=document.createElement("button");
btn.textContent="Harvest";

btn.onclick=()=>{
money += p.gain * mut.m * income.mult;
updateMoney();
box.remove();
autoSave();
};

box.appendChild(btn);

}else{

let t=5;
cd.textContent="Harvest in "+t+"s";

const interval=setInterval(()=>{

t--;
cd.textContent="Harvest in "+t+"s";

if(t<=0){
money += p.gain * mut.m * income.mult;
updateMoney();
autoSave();
t=5;
}

},1000);

/* store interval so shovel can stop it later */
box.dataset.interval = interval;

}

}

/* Permanently destroy a plant element and stop any generators, then save */
function destroyPlant(box){
  try {
    // clear any stored interval on this box
    if (box && box.dataset && box.dataset.interval) {
      const iid = Number(box.dataset.interval);
      if (!isNaN(iid)) clearInterval(iid);
      delete box.dataset.interval;
    }
    // remove from DOM
    if (box && box.parentNode) box.parentNode.removeChild(box);
    // persist removal so localStorage won't recreate it
    autoSave();
    showToast('Shoveled plant');
  } catch (e) {
    console.error('destroyPlant error', e);
  }
}

function buyPlant(p){
if(money<p.buy) return alert("Not enough money");

money-=p.buy;
updateMoney();

addToGarden(p);
}

function createShop(){

const shop=document.getElementById("shop");

plants.filter(p=>p.buy>0).forEach(p=>{

const d=document.createElement("div");
d.className="item";

d.innerHTML=`<b>${p.name}</b><br>Buy:${formatNumber(p.buy)}<br>Gives:${formatNumber(p.gain)}<br><button>Buy</button>`;

d.querySelector("button").onclick=()=>buyPlant(p);

shop.appendChild(d);

});

}

/* =========================
   ADMIN SYSTEM
========================= */

function runAdminCommand(){

if(!devMode) return;

const cmd=document.getElementById("adminCommand").value.trim();

/* PLANT PARTY */
if(cmd.startsWith("/plantparty")){
startPlantParty();
return;
}

/* CARROTS EVENT */
if(cmd.startsWith("/carrots")){
startCarrotEvent();
autoSave();
}

else if(cmd.startsWith("/spawn(")){

const matches=cmd.match(/\/spawn\((.*?)\)\((.*?)\)/);
if(!matches) return;

const plantName=matches[1].trim().toLowerCase();
const mutation=matches[2].trim().toLowerCase();

const p=plants.find(x=>x.name.toLowerCase().replaceAll(" ","")===plantName);
if(!p) return alert("Plant not found");

let mut={m:1,c:""};

if(mutation==="silver") mut={m:5,c:"silver"};
if(mutation==="gold") mut={m:20,c:"gold"};
if(mutation==="rainbow") mut={m:50,c:"rainbow"};
if(mutation==="disco") mut={m:125,c:"disco"};
if(mutation==="admin") mut={m:1000000,c:"admin"};
if(mutation==="rickroll") mut={m:1e100,c:"rickroll"};

addToGarden(p,mut);
autoSave();

}

else if(cmd.startsWith("/givemoney(")){

const match=cmd.match(/\/givemoney\((.*?)\)/);
if(!match) return;

let amount=Number(match[1]);
if(isNaN(amount)) return alert("Invalid number");

money+=amount;
updateMoney();
autoSave();

}

else if(cmd.startsWith("/mutateall(")){

const match=cmd.match(/\/mutateall\((.*?)\)/);
if(!match) return;

const mutation=match[1].trim().toLowerCase();

let mut={m:1,c:""};

if(mutation==="silver") mut={m:5,c:"silver"};
if(mutation==="gold") mut={m:20,c:"gold"};
if(mutation==="rainbow") mut={m:50,c:"rainbow"};
if(mutation==="disco") mut={m:125,c:"disco"};
if(mutation==="admin") mut={m:1000000,c:"admin"};
if(mutation==="rickroll") mut={m:1e100,c:"rickroll"};

document.querySelectorAll(".plant").forEach(box=>{
  const title=box.querySelector("b");
  title.classList.remove("silver","gold","rainbow","disco","admin","rickroll");
  if(mut.c) title.classList.add(mut.c);
});

autoSave();

}

else if(cmd.startsWith("/incomemultiplier(")){

const match=cmd.match(/\/incomemultiplier\((.*?)\)/);
if(!match) return;

let value=Number(match[1]);

if(isNaN(value) || value<=0){
alert("Invalid multiplier");
return;
}

income.mult=value;
alert("Income multiplier set to x"+value);
autoSave();

}

else if(cmd.startsWith("/deleteall")){

document.querySelectorAll(".plant").forEach(box=>{
  if (box && box.dataset && box.dataset.interval) {
    const iid = Number(box.dataset.interval);
    if (!isNaN(iid)) clearInterval(iid);
  }
  box.remove();
});

autoSave();
alert("All plants deleted!");

}

}

/* =========================
   UI CONTROLS
========================= */

function openAdmin(){
document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
document.getElementById("adminPanel").style.display="none";
}

function unlockAdmin(){

const pass=document.getElementById("adminPassword").value;

if(pass==="0598"){

devMode=true;
document.getElementById("adminTools").style.display="block";
alert("Admin mode activated!");

}else{
alert("Wrong password");
}

}

/* SAVE / LOAD */

/* Maps CSS class → income multiplier, kept in sync with getMutation + spawn logic */
const mutMultipliers={
  "":1,
  "silver":5,
  "gold":20,
  "rainbow":50,
  "disco":125,
  "admin":1000000,
  "rickroll":1e100
};

function getMutClass(classList){
  for(const c of ["rickroll","admin","disco","rainbow","gold","silver"]){
    if(classList.contains(c)) return c;
  }
  return "";
}

function getPlantData(){
const plantData=[];
document.querySelectorAll(".plant").forEach(box=>{
const title=box.querySelector("b");
const mutClass=getMutClass(title.classList);
plantData.push({
name:title.textContent,
mutClass:mutClass,
mutMult:mutMultipliers[mutClass]??1
});
});
return plantData;
}

function saveGame(){
localStorage.setItem("gardenMoney",money);
localStorage.setItem("gardenPlants",JSON.stringify(getPlantData()));
alert("Saved!");
}

function autoSave(){
localStorage.setItem("gardenMoney",money);
localStorage.setItem("gardenPlants",JSON.stringify(getPlantData()));
}

function loadGame(){

const savedMoney=localStorage.getItem("gardenMoney");
const savedPlants=localStorage.getItem("gardenPlants");

if(savedMoney) money=Number(savedMoney);

if(savedPlants){

JSON.parse(savedPlants).forEach(item=>{

/* Try exact name match first (handles already-renamed party names) */
let p=plants.find(x=>x.name===item.name);

/* If not found, try matching against party names */
if(!p){
  const originalName=Object.keys(partyNames).find(k=>partyNames[k]===item.name);
  if(originalName) p=plants.find(x=>x.name===originalName);
}

if(!p) return;

/* Build forceMut from saved data so the multiplier closure is correct */
const savedClass = item.mutClass ?? "";
const savedMult  = item.mutMult  ?? (mutMultipliers[savedClass] ?? 1);
const forceMut   = { m: savedMult, c: savedClass };

addToGarden(p, forceMut);

/* Restore the exact saved name (party names persist after rename) */
const boxes=document.querySelectorAll(".plant");
const lastBox=boxes[boxes.length-1];
if(lastBox){
  const title=lastBox.querySelector("b");
  if(title) title.textContent=item.name;
}

});

}

}

function resetGame(){

if(!confirm("Delete all saved data?")) return;

localStorage.removeItem("gardenMoney");
localStorage.removeItem("gardenPlants");

money=10;
garden.innerHTML="";

updateMoney();

alert("Reset!");
}

/* =========================
   SHOVEL: toggle with "S", click plants to destroy permanently
   - shovelMode toggles with S
   - visual: body.shovel-active and .shovel-mode on plants
   - destroyPlant clears any stored interval on the element and autoSaves
========================= */

let shovelMode = false;

function showToast(text, ms = 1100) {
  toast.textContent = text;
  toast.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.display = 'none'; }, ms);
}

function setShovel(on) {
  shovelMode = !!on;
  if (shovelMode) {
    document.body.classList.add('shovel-active');
    document.querySelectorAll('.plant').forEach(el => el.classList.add('shovel-mode'));
    showToast('Shovel equipped');
  } else {
    document.body.classList.remove('shovel-active');
    document.querySelectorAll('.plant').forEach(el => el.classList.remove('shovel-mode'));
    showToast('Shovel unequipped');
  }
}

// toggle shovel with "S"
document.addEventListener('keydown', (e) => {
  if (e.key && e.key.toLowerCase() === 's') {
    setShovel(!shovelMode);
  }
});

// When new plants are added/loaded the visual state should reflect current shovel mode.
// (We already add/remove .shovel-mode in addToGarden and loadGame uses addToGarden)
function refreshShovelVisuals() {
  if (shovelMode) {
    document.querySelectorAll('.plant').forEach(el => el.classList.add('shovel-mode'));
    document.body.classList.add('shovel-active');
  } else {
    document.querySelectorAll('.plant').forEach(el => el.classList.remove('shovel-mode'));
    document.body.classList.remove('shovel-active');
  }
}

/* INIT */

document.addEventListener("keydown",e=>{
if(e.key==="b" || e.key==="B"){
openAdmin();
}
});

loadGame();
createShop();
updateMoney();
refreshShovelVisuals();

/* Helpful: keep shovel visuals updated when loading/saving plants */
const observer = new MutationObserver(()=>refreshShovelVisuals());
observer.observe(garden, { childList: true, subtree: false });

</script>
</body>
