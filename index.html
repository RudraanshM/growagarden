<!DOCTYPE html>
<html lang="en">

<title>Grow a Garden</title>
<style>
* {

  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #c2f0b2 0%, #9fd88e 100%);

h1 {

.hud-row {

#money {
  font-size: 20px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.88);

  border-radius: 12px;

}

.top-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.top-controls button {

  border: 2px solid rgba(0,0,0,0.2);

  cursor: pointer;

}

.top-controls button:hover {

}

.top-controls button:active {

#saveBtn { background: #1e88e5; }
#tutBtn { background: #2e7d32; }
#shovelTopBtn { background: #ef6c00; }
#shovelTopBtn.active-shovel {

  color: #1a1a1a;
  border-color: #ef6c00;
}
#resetBtn { background: #d32f2f; }

#shop, #garden {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.item, .plant {
  background: rgba(255, 255, 255, 0.94);
  border: 2px solid #2c3e29;
  border-radius: 14px;
  padding: 12px;
  width: 196px;
  text-align: center;

}

.item-name, .plant-title {

}

.item-stats {

}

.mult-summary {

  font-weight: 800;

  background: #e8f5e9;
  border: 1px solid #a5d6a7;
  border-radius: 8px;
  padding: 2px 6px;
  display: inline-block;
  margin-top: 6px;
}

.item button, .plant button {
  margin-top: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 700;
  border: 2px solid #2c3e29;
  border-radius: 8px;
  background: #e8f5e9;
  color: #1b2e18;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s ease, transform 0.1s ease;

}

.item button:hover, .plant button:hover {

}

.item button:active, .plant button:active {
  transform: scale(0.96);
}

.cooldown {

  font-weight: 600;

/* MUTATION BADGES & TEXT STYLES */
.mut-tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  margin-top: 6px;
}

.mut-badge {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 999px;
  background: #263238;
  color: #fff;

}

.silver { color: #78909c; }
.gold { color: #f59e0b; text-shadow: 0 0 4px rgba(245,158,11,0.35); }

.rainbow {
  background: linear-gradient(90deg,#ff1744,#ff9100,#ffea00,#00e676,#2979ff,#d500f9);
  background-size: 300%;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 3s linear infinite;
}

@keyframes rainbow {
  0% { background-position: 0%; }
  100% { background-position: 100%; }
}

.disco {
  animation: disco 0.5s infinite;
}

@keyframes disco {
  0% { color: #ff1744; }
  25% { color: #ffea00; }
  50% { color: #00e676; }
  75% { color: #2979ff; }
  100% { color: #ff1744; }
}

/* WEATHER MUTATIONS */
.wet { color: #0288d1; }
.frozen { color: #00acc1; text-shadow: 0 0 4px rgba(0,172,193,0.4); }
.shocked { color: #fbc02d; text-shadow: 0 0 6px rgba(251,192,45,0.6); }

.sunburnt { color: #e64a19; }

body.weather-windy { background: linear-gradient(180deg, #a5d6a7 0%, #81c784 100%); }

body.weather-thunderstorm h1, body.weather-thunderstorm h2,

#weatherEffectsLayer {
  position: fixed;

  pointer-events: none;
  z-index: 9000;
  overflow: hidden;
}

#lightningFlash {

  inset: 0;
  background: rgba(255, 255, 210, 0.75);

  z-index: 9005;

#heatAura {

@keyframes heatPulse {

}

.weather-particle {

  z-index: 9001;
}

.wind-streak {

  height: 2px;

  border-radius: 2px;
  pointer-events: none;
  z-index: 9002;
}

#weatherBanner {

  font-size: 16px;

<script>

/* =====================

===================== */

  windstruck: { label: "Windstruck", bonus: 2,   cls: "windstruck" }, // +2 -> 3x total

const plants = [
  { name: "Carrot", type: "single", buy: 10, gain: 18 },
  { name: "Strawberry", type: "multi", buy: 50, gain: 14 },
  { name: "Blueberry", type: "multi", buy: 400, gain: 18 },

function formatNumber(n) {
  const units = [
    "", "K", "M", "B", "T",
    "Qa", "Qi", "Sx", "Sp", "Oc", "No",
    "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd",
    "Vg", "Uvg", "Dvg", "Tvg", "Qavg", "Qivg", "Sxvg", "Spvg", "Ocvg", "Novg"
  ];
  if (n < 1000) return Math.floor(n);
  const tier = Math.floor(Math.log10(n) / 3);
  if (tier >= units.length) return n.toExponential(2);
  const scale = Math.pow(10, tier * 3);
  return (n / scale).toFixed(2) + " " + units[tier];
}

function showToast(msg, ms = 1600) {
  toastDiv.textContent = msg;
  toastDiv.style.display = "block";
  clearTimeout(toastDiv._timer);
  toastDiv._timer = setTimeout(() => {
    toastDiv.style.display = "none";
  }, ms);
}

function updateMoney() {
  moneyDiv.textContent = "Money: " + formatNumber(money);
}

/* =====================
   MUTATION MATH & RENDER
===================== */
function getPlantMutations(box) {
  try {
    return JSON.parse(box.dataset.mutations || "[]");
  } catch {
    return [];
  }
}

// Additive multiplier: base 1 + sum of all active mutation bonuses
function getAdditiveMultiplier(box) {
  const mutList = getPlantMutations(box);
  let total = 1;
  for (const key of mutList) {
    if (mutations[key]) total += mutations[key].bonus;
  }
  return total;
}

function renderPlantVisuals(box) {
  const mutList = getPlantMutations(box);
  const titleEl = box.querySelector(".plant-title");
  const tagsEl = box.querySelector(".mut-tags");
  const multEl = box.querySelector(".mult-summary");

  if (titleEl) {
    Object.values(mutations).forEach(m => titleEl.classList.remove(m.cls));
    if (mutList.length > 0) {
      const topMut = mutations[mutList[mutList.length - 1]];
      if (topMut) titleEl.classList.add(topMut.cls);
    }
  }

  if (tagsEl) {
    tagsEl.innerHTML = "";
    mutList.forEach(key => {
      const m = mutations[key];
      if (!m) return;
      const badge = document.createElement("span");
      badge.className = "mut-badge " + m.cls;
      badge.textContent = `${m.label} +${m.bonus}x`;
      tagsEl.appendChild(badge);
    });
  }

  if (multEl) {
    const totalMult = getAdditiveMultiplier(box);
    multEl.textContent = `Multiplier: ${totalMult}x`;
  }
}

function addMutation(box, key, notify = true) {
  if (!mutations[key]) return false;
  const mutList = getPlantMutations(box);
  if (mutList.includes(key)) return false;
  mutList.push(key);
  box.dataset.mutations = JSON.stringify(mutList);
  renderPlantVisuals(box);
  if (notify) {
    const name = box.querySelector(".plant-title")?.textContent || "Plant";
    showToast(`✨ ${name} gained ${mutations[key].label} (+${mutations[key].bonus}x)!`);
  }
  return true;
}

function rollInitialMutation() {
  const r = Math.random();
  if (r < 0.00001) return ["disco"];
  if (r < 0.002) return ["rainbow"];
  if (r < 0.015) return ["gold"];
  if (r < 0.07) return ["silver"];
  return [];
}

/* =====================
   WEATHER SYSTEM + EFFECTS
===================== */
function triggerLightningFlash() {
  const flash = document.getElementById("lightningFlash");
  flash.style.opacity = "0.85";
  setTimeout(() => { flash.style.opacity = "0"; }, 90);
  setTimeout(() => {
    flash.style.opacity = "0.45";
    setTimeout(() => { flash.style.opacity = "0"; }, 70);
  }, 160);
}

function spawnWindStreak() {
  const layer = document.getElementById("weatherEffectsLayer");
  const streak = document.createElement("div");
  streak.className = "wind-streak";
  streak.style.top = (Math.random() * window.innerHeight) + "px";
  streak.style.left = "-110px";
  layer.appendChild(streak);

  let x = -110;
  const speed = 16 + Math.random() * 10;
  const timer = setInterval(() => {
    x += speed;
    streak.style.left = x + "px";
    if (x > window.innerWidth + 120) {
      clearInterval(timer);
      streak.remove();
    }
  }, 20);
}

function spawnWeatherParticle(weather) {
  if (weather.id === "windy" && Math.random() < 0.65) {
    spawnWindStreak();
  }

  const layer = document.getElementById("weatherEffectsLayer");
  const el = document.createElement("div");
  el.className = "weather-particle";
  el.textContent = weather.particle;

  let x = Math.random() * window.innerWidth;
  let y = weather.id === "meteorshower" ? -30 : -20;
  el.style.left = x + "px";
  el.style.top = y + "px";
  layer.appendChild(el);

  let vx = 0;
  let vy = 5 + Math.random() * 4;

  if (weather.id === "windy") {
    vx = 6 + Math.random() * 4;
    vy = 2 + Math.random() * 2;
  } else if (weather.id === "meteorshower") {
    vx = -5 - Math.random() * 3;
    vy = 8 + Math.random() * 5;
  } else if (weather.id === "snow") {
    vx = (Math.random() - 0.5) * 2;
    vy = 2 + Math.random() * 2;
  }

  const timer = setInterval(() => {
    x += vx;
    y += vy;
    el.style.left = x + "px";
    el.style.top = y + "px";
    if (y > window.innerHeight + 40 || x < -60 || x > window.innerWidth + 60) {
      clearInterval(timer);
      el.remove();
    }
  }, 25);
}

function startRandomWeather() {
  if (activeWeather) return;
  const chosen = weatherEvents[Math.floor(Math.random() * weatherEvents.length)];
  activeWeather = chosen;

  document.body.classList.add(chosen.bodyClass);

  const banner = document.getElementById("weatherBanner");
  const textEl = document.getElementById("weatherText");
  const countEl = document.getElementById("weatherCountdown");

  let secondsLeft = 60;
  textEl.textContent = `${chosen.name} — ${chosen.desc}`;
  countEl.textContent = secondsLeft;
  banner.style.display = "block";

  if (chosen.id === "thunderstorm") {
    triggerLightningFlash();
  }

  weatherEffectInterval = setInterval(() => {
    spawnWeatherParticle(chosen);
    if (chosen.id === "thunderstorm" && Math.random() < 0.08) {
      triggerLightningFlash();
    }
  }, 240);

  const tickInterval = setInterval(() => {
    secondsLeft--;
    countEl.textContent = secondsLeft;

    let changed = false;
    document.querySelectorAll(".plant").forEach(box => {
      // 1% chance every second per plant to get the weather mutation
      if (Math.random() < 0.01) {
        if (addMutation(box, chosen.mutation, true)) {
          changed = true;
        }
      }
    });

    if (changed) autoSave();

    if (secondsLeft <= 0) {
      clearInterval(tickInterval);
      clearInterval(weatherEffectInterval);
      document.body.classList.remove(chosen.bodyClass);
      document.getElementById("weatherEffectsLayer").innerHTML = "";
      banner.style.display = "none";
      activeWeather = null;
    }
  }, 1000);
}

// Every 5 minutes (300,000 ms), trigger a random weather event for 1 minute
setInterval(startRandomWeather, 300000);

/* =====================
   GARDEN & SHOP
===================== */
function addToGarden(plantObj, forcedMutations = null) {
  const box = document.createElement("div");
  box.className = "plant";

  const title = document.createElement("span");
  title.className = "plant-title";
  title.textContent = plantObj.name;
  box.appendChild(title);

  const tags = document.createElement("div");
  tags.className = "mut-tags";
  box.appendChild(tags);

  const multBadge = document.createElement("div");
  multBadge.className = "mult-summary";
  box.appendChild(multBadge);

  const cd = document.createElement("div");
  cd.className = "cooldown";
  box.appendChild(cd);

  const initialMuts = Array.isArray(forcedMutations) ? forcedMutations : rollInitialMutation();
  box.dataset.mutations = JSON.stringify(initialMuts);
  renderPlantVisuals(box);

  box.addEventListener("click", (ev) => {
    if (ev.target && ev.target.closest && ev.target.closest("button")) return;
    if (shovelMode) destroyPlant(box);
  });

  if (plantObj.type === "single") {
    const btn = document.createElement("button");
    btn.textContent = `Harvest (+${formatNumber(plantObj.gain)})`;
    btn.onclick = () => {
      const mult = getAdditiveMultiplier(box);
      money += plantObj.gain * mult;
      updateMoney();
      box.remove();
      autoSave();
    };
    box.appendChild(btn);
  } else {
    let t = 5;
    cd.textContent = `Auto-harvest in ${t}s`;
    const interval = setInterval(() => {
      t--;
      cd.textContent = `Auto-harvest in ${t}s`;
      if (t <= 0) {
        const mult = getAdditiveMultiplier(box);
        money += plantObj.gain * mult;
        updateMoney();
        autoSave();
        t = 5;
      }
    }, 1000);
    box.dataset.interval = interval;
  }

  gardenDiv.appendChild(box);
  refreshShovelVisuals();
  autoSave();
}

function destroyPlant(box) {
  if (box.dataset.interval) {
    clearInterval(Number(box.dataset.interval));
    delete box.dataset.interval;
  }
  box.remove();
  autoSave();
  showToast("🪓 Removed plant with shovel");
}

function buyPlant(plantObj) {
  if (money < plantObj.buy) {
    showToast("❌ Not enough money!");
    return;
  }
  money -= plantObj.buy;
  updateMoney();
  addToGarden(plantObj);
}

function createShop() {
  shopDiv.innerHTML = "";
  plants.forEach(p => {
    const card = document.createElement("div");
    card.className = "item";
    card.innerHTML = `
      <span class="item-name">${p.name}</span>
      <div class="item-stats">
        Type: <b>${p.type === "single" ? "Single Harvest" : "Auto Every 5s"}</b><br>
        Cost: <b>${formatNumber(p.buy)}</b><br>
        Base Yield: <b>${formatNumber(p.gain)}</b>
      </div>
      <button>Buy</button>
    `;
    card.querySelector("button").onclick = () => buyPlant(p);
    shopDiv.appendChild(card);
  });
}

/* =====================
   SHOVEL TOOL
===================== */
function setShovel(on) {
  shovelMode = !!on;
  const topBtn = document.getElementById("shovelTopBtn");
  const mobBtn = document.getElementById("mobileShovelBtn");
  const label = shovelMode ? "🪓 Shovel: ON" : "🪓 Shovel: OFF";

  if (topBtn) {
    topBtn.textContent = label;
    topBtn.classList.toggle("active-shovel", shovelMode);
  }
  if (mobBtn) {
    mobBtn.textContent = label;
    mobBtn.classList.toggle("active-shovel", shovelMode);
  }

  document.body.classList.toggle("shovel-active", shovelMode);
  refreshShovelVisuals();
  showToast(shovelMode ? "🪓 Shovel ON — tap a plant to remove" : "Shovel OFF");
}

function refreshShovelVisuals() {
  document.querySelectorAll(".plant").forEach(el => {
    el.classList.toggle("shovel-mode", shovelMode);
  });
}

document.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key && e.key.toLowerCase() === "s") {
    setShovel(!shovelMode);
  }
});

/* =====================
   SAVE & LOAD
===================== */
function getPlantSaveData() {
  return Array.from(document.querySelectorAll(".plant")).map(box => ({
    name: box.querySelector(".plant-title")?.textContent || "",
    mutations: getPlantMutations(box)
  }));
}

function saveGame() {
  localStorage.setItem("gag_money", String(money));
  localStorage.setItem("gag_plants", JSON.stringify(getPlantSaveData()));
  showToast("💾 Game saved!");
}

function autoSave() {
  localStorage.setItem("gag_money", String(money));
  localStorage.setItem("gag_plants", JSON.stringify(getPlantSaveData()));
}

function loadGame() {
  const savedMoney = localStorage.getItem("gag_money");
  const savedPlants = localStorage.getItem("gag_plants");

  if (savedMoney !== null && !isNaN(Number(savedMoney))) {
    money = Number(savedMoney);
  }

  if (savedPlants) {
    try {
      const list = JSON.parse(savedPlants);
      list.forEach(item => {
        const plantObj = plants.find(p => p.name === item.name);
        if (!plantObj) return;
        const validMuts = Array.isArray(item.mutations)
          ? item.mutations.filter(m => mutations[m])
          : [];
        addToGarden(plantObj, validMuts);
      });
    } catch (err) {
      console.error("Failed to load plants:", err);
    }
  }
}

function resetGame() {
  if (!confirm("Reset your money and garden?")) return;
  localStorage.removeItem("gag_money");
  localStorage.removeItem("gag_plants");
  money = 10;
  document.querySelectorAll(".plant").forEach(box => {
    if (box.dataset.interval) clearInterval(Number(box.dataset.interval));
  });
  gardenDiv.innerHTML = "";
  updateMoney();
  showToast("🗑 Garden reset!");
}

/* =====================
   LIVE SPOTLIGHT TUTORIAL
===================== */
const tutorialSteps = [
  {
    selector: "#money",
    title: "Your Money Balance",
    desc: "This tracks your cash. Spend it in the Shop to buy seeds and grow your garden."
  },
  {
    selector: "#shop",
    title: "Plant Shop",
    desc: "Click or tap Buy on any plant card here. Single plants pay out when harvested; multi plants auto-harvest every 5 seconds."
  },
  {
    selector: "#garden",
    title: "Your Garden & Additive Mutations",
    desc: "Planted items appear here. Mutations ADD together (+4x + +1x = 6x total) and show right on each card!"
  },
  {
    selector: "#weatherBanner",
    title: "Weather Events (Every 5 Mins)",
    desc: "Every 5 minutes, a weather event runs for 1 minute with live screen effects and a 1%/sec chance per plant to add its mutation."
  },
  {
    selector: window.innerWidth <= 600 ? "#mobileBar" : "#topControls",
    title: "Shovel & Controls",
    desc: "Toggle the Shovel (press S on desktop or use the bar on mobile) to remove plants, or save your progress anytime."
  }
];

let tutIndex = 0;
let currentHighlightedEl = null;

function clearHighlight() {
  if (currentHighlightedEl) {
    currentHighlightedEl.classList.remove("tutorial-highlight");
    currentHighlightedEl = null;
  }
}

function positionTooltip(targetEl) {
  const tooltip = document.getElementById("tutorialTooltip");
  tooltip.style.display = "block";

  if (!targetEl) {
    tooltip.style.top = "50%";
    tooltip.style.left = "50%";
    tooltip.style.transform = "translate(-50%, -50%)";
    return;
  }

  targetEl.scrollIntoView({ behavior: "smooth", block: "center" });

  setTimeout(() => {
    const rect = targetEl.getBoundingClientRect();
    const tipRect = tooltip.getBoundingClientRect();
    tooltip.style.transform = "none";

    let left = Math.min(
      Math.max(12, rect.left + rect.width / 2 - tipRect.width / 2),
      window.innerWidth - tipRect.width - 12
    );

    let top = rect.bottom + 14;
    if (top + tipRect.height > window.innerHeight - 16) {
      top = Math.max(12, rect.top - tipRect.height - 14);
    }

    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }, 160);
}

function renderTutorialStep() {
  clearHighlight();
  const step = tutorialSteps[tutIndex];
  const el = document.querySelector(step.selector);

  // Temporarily show weather banner during its spotlight step if hidden
  const banner = document.getElementById("weatherBanner");
  const wasBannerHidden = banner.style.display === "none";
  if (step.selector === "#weatherBanner" && wasBannerHidden) {
    document.getElementById("weatherText").textContent = "Preview: 🌧️ Rainstorm — 1%/sec for Wet (+1x)";
    document.getElementById("weatherCountdown").textContent = "60";
    banner.style.display = "block";
    banner.dataset.preview = "1";
  } else if (banner.dataset.preview === "1" && step.selector !== "#weatherBanner") {
    banner.style.display = "none";
    delete banner.dataset.preview;
  }

  if (el) {
    el.classList.add("tutorial-highlight");
    currentHighlightedEl = el;
  }

  document.getElementById("tutTitle").textContent = step.title;
  document.getElementById("tutDesc").textContent = step.desc;
  document.getElementById("tutStepCount").textContent = `${tutIndex + 1} / ${tutorialSteps.length}`;
  document.getElementById("tutPrevBtn").disabled = tutIndex === 0;
  document.getElementById("tutNextBtn").textContent = tutIndex === tutorialSteps.length - 1 ? "Finish" : "Next";

  positionTooltip(el);
}

function startLiveTutorial() {
  tutIndex = 0;
  document.getElementById("spotlightBackdrop").style.display = "block";
  renderTutorialStep();
}

function stepTutorial(delta) {
  const nextIdx = tutIndex + delta;
  if (nextIdx < 0) return;
  if (nextIdx >= tutorialSteps.length) {
    endLiveTutorial();
    return;
  }
  tutIndex = nextIdx;
  renderTutorialStep();
}

function endLiveTutorial() {
  clearHighlight();
  document.getElementById("spotlightBackdrop").style.display = "none";
  document.getElementById("tutorialTooltip").style.display = "none";
  const banner = document.getElementById("weatherBanner");
  if (banner.dataset.preview === "1") {
    banner.style.display = "none";
    delete banner.dataset.preview;
  }
  localStorage.setItem("gag_tut_done", "1");
}

/* INIT */
createShop();
loadGame();
updateMoney();

if (!localStorage.getItem("gag_tut_done")) {
  startLiveTutorial();
}
</script>
